exclude: (^vendor/)

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
      # Ensure files end with newline
      - id: end-of-file-fixer
      # Check for merge conflict markers
      - id: check-merge-conflict
      # Check for large files being added
      - id: check-added-large-files
        args: ["--maxkb=200000"]
      # Check TOML files
      - id: check-toml
      # Check YAML files
      - id: check-yaml
      # Check JSON files
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json
      - id: pretty-format-json
        exclude: ^.devcontainer/devcontainer.json
        args: [--autofix, --no-sort-keys]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # shfmt - Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-w"]
        types_or: [shell]

  # Ruff (local via uv) - Python linting and formatting
  - repo: local
    hooks:
      # Run ruff linter
      - id: ruff-check
        name: ruff-check (local)
        entry: uv run ruff check
        language: system
        args: ["--fix"]
        types_or: [python, pyi]
      # Run ruff formatter
      - id: ruff-format
        name: ruff-format (local)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

  # ty - Python type checker
  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        entry: ty check src
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  # Prettier (local) - JSON/YAML/TOML formatting
  - repo: local
    hooks:
      - id: prettier-local
        name: prettier (local)
        alias: prettier
        entry: npx --yes prettier
        language: system
        types_or:
          - json
          - yaml
        args:
          - "-w"
          - "--tab-width=2"
